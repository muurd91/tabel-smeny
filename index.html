<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F5D4E">
  <meta name="color-scheme" content="light">
  <!-- Версия приложения: та же, что VERSION в sw.js и ?v= у файлов ниже (меняет tools/bump.sh) -->
  <meta name="app-version" content="43">
  <title>Табель смены</title>
  <meta name="apple-mobile-web-app-title" content="Табель смены">
  <meta name="application-name" content="Табель смены">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=43">
  <link rel="stylesheet" href="css/splash.css?v=43">
</head>
<body>
  <!-- Заставка при запуске — только телефон в портрете (css/splash.css, js/splash.js); после показа удаляется -->
  <div class="splash" id="splash" aria-hidden="true">
    <svg class="splash__bg" viewBox="0 0 100 217" preserveAspectRatio="none" focusable="false">
      <defs>
        <linearGradient id="splash-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8f7c"/><stop offset="1" stop-color="#1d5a4a"/></linearGradient>
        <linearGradient id="splash-floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5a42"/><stop offset="1" stop-color="#5c3326"/></linearGradient>
      </defs>
      <rect width="100" height="217" fill="url(#splash-sky)"/>
      <polygon points="0,150 100,112 100,217 0,217" fill="url(#splash-floor)"/>
    </svg>
    <div class="splash__pots">
      <img class="splash__pot splash__pot--1" data-src="icons/splash/pot-red-flowers.webp" alt="">
      <img class="splash__pot splash__pot--2" data-src="icons/splash/pot-pink-roses.webp" alt="">
      <img class="splash__pot splash__pot--3" data-src="icons/splash/pot-red-sprout.webp" alt="">
      <img class="splash__pot splash__pot--4" data-src="icons/splash/pot-terracotta.webp" alt="">
      <img class="splash__pot splash__pot--5" data-src="icons/splash/pot-black-herb.webp" alt="">
      <img class="splash__pot splash__pot--6" data-src="icons/splash/pot-white-planter.webp" alt="">
    </div>
    <div class="splash__content">
      <div class="splash__card"><img class="splash__logo" data-src="icons/splash/logo.png" alt="Амина"></div>
      <div class="splash__slogan">Амина – все для<br>зеленого бизнеса</div>
      <div class="splash__pill"><i></i><span>ЗАГРУЗКА</span></div>
    </div>
    <div class="splash__sig">Идея и разработка — <b>А. Н. Меньков</b></div>
  </div>
  <script src="js/splash.js?v=43"></script>

  <header class="top" id="top">
    <!-- Шапка из двух блоков: смена (тип, дата, сколько осталось, полоса хода смены) и состояние облака.
         На «Настройках» шапки нет. -->
    <div class="shiftbar" id="shiftbar"></div>
    <button class="sync" id="sync" type="button" title="Облако"><span class="sync__dot" aria-hidden="true"></span><span class="sync__text" id="sync-text"></span></button>
  </header>

  <!-- Экраны скрыты, пока app.js не покажет нужный (последний открытый) -->
  <main class="main">
    <section class="view" id="view-shift" hidden></section>
    <section class="view" id="view-tabel" hidden></section>
    <section class="view" id="view-people" hidden></section>
    <section class="view" id="view-more" hidden></section>
  </main>

  <!-- Если приложение не запустилось (не загрузился или упал скрипт) — подсказка вместо пустого экрана -->
  <div class="app-error" id="app-error" role="alert" hidden>
    <b>Приложение не загрузилось</b>
    <p>Обычно помогает обновление. Данные на телефоне и в облаке при этом не пропадут.</p>
    <button class="btn btn--primary" id="app-reload" type="button">Обновить приложение</button>
  </div>

  <nav class="nav" id="nav" aria-label="Разделы">
    <button class="nav__btn" data-view="shift" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 3v2M17 3v2M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm4 9 2 2 4-4"/></svg><span>Смена</span></button>
    <button class="nav__btn" data-view="tabel" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v14H4zM4 10h16M4 15h16M9 5v14M14.5 5v14"/></svg><span>Табель</span></button>
    <button class="nav__btn" data-view="people" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-6 9c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.5c1.8.9 3 2.9 3 5.5"/></svg><span>Люди</span></button>
    <button class="nav__btn" data-view="more" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>Настройки</span></button>
  </nav>

  <dialog class="sheet" id="sheet"><form method="dialog" class="sheet__body" id="sheet-body"></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="file-xlsx" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input type="file" id="file-json" accept=".json,application/json" hidden>

  <!-- ?v= — чтобы новая страница никогда не взяла из кэша старые скрипты (иначе после обновления — пустой экран) -->
  <script src="js/config.js?v=43"></script>
  <script src="js/data.js?v=43"></script>
  <script src="js/cloud.js?v=43"></script>
  <script src="js/xlsx.js?v=43"></script>
  <script src="js/telegram.js?v=43"></script>
  <script src="js/report.js?v=43"></script>
  <script src="js/app.js?v=43"></script>
  <script>
    // app.js в конце ставит window.appStarted; если его нет — что-то не загрузилось или упало при запуске.
    if (!window.appStarted) document.getElementById('app-error').hidden = false;
    // «Обновить»: убрать сохранённую копию приложения (не данные) и загрузить заново из сети.
    document.getElementById('app-reload').onclick = async function () {
      try {
        const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
        await Promise.all(regs.map(function (r) { return r.unregister(); }));
        const keys = await caches.keys();
        await Promise.all(keys.filter(function (k) { return k.indexOf('ts-shell-') === 0; }).map(function (k) { return caches.delete(k); }));
      } catch (e) {}
      location.reload();
    };
  </script>
</body>
</html>
