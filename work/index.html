<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F5D4E">
  <meta name="color-scheme" content="light">
  <!-- Версия: та же, что VERSION в work/sw.js и ?v= у файлов ниже (меняет tools/bump.sh) -->
  <meta name="app-version" content="70">
  <!-- iPhone: ярлык на экране «Домой» открывается как приложение (без адресной строки), с этим названием под значком -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Продукция">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Продукция смены</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=70">
  <link rel="stylesheet" href="work.css?v=70">
</head>
<body class="work">
  <!-- Шапка как в приложении: слева смена (тип, дата, сколько осталось, полоса хода), справа — связь -->
  <header class="top" id="top">
    <div class="shiftbar" id="shiftbar"></div>
    <div class="sync" id="sync" data-state="auth"><span class="sync__dot" aria-hidden="true"></span><span class="sync__text" id="sync-text"></span></div>
  </header>
  <main class="wmain" id="app"><p class="muted">Загрузка…</p></main>
  <p class="wver" id="ver"></p>
  <dialog class="sheet" id="sheet"><form method="dialog" class="sheet__body" id="sheet-body"></form></dialog>
  <!-- Окно «Доступно обновление»: показывает work.js, когда на сайте появилась версия новее запущенной -->
  <dialog class="sheet" id="update"><div class="sheet__body">
    <div class="sheet__grip" tabindex="-1"></div>
    <h3>Доступно обновление</h3>
    <p class="sheet__sub" id="update-text"></p>
    <div class="sheet__actions"><button class="btn" id="update-later" type="button">Позже</button><button class="btn btn--primary" id="update-now" type="button">Обновить</button></div>
  </div></dialog>
  <script src="../js/config.js?v=70"></script>
  <script src="../js/sheet-drag.js?v=70"></script>
  <script src="work.js?v=70"></script>
</body>
</html>
